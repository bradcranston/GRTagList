<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      @import "./src/style.css";
    </style>
    <title>GR Tag List</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Location Tags</h2>
        <div class="header-actions">
          <div class="export-buttons">
            <button id="exportLocations" class="btn btn-primary btn-sm me-2">
              <i class="bi bi-download"></i> Export Locations
            </button>
            <button id="exportContacts" class="btn btn-success btn-sm me-3">
              <i class="bi bi-person-lines-fill"></i> Export Contacts
            </button>
          </div>
          <div class="count-badge">
            <span id="locationCount">0</span> locations
          </div>
        </div>
      </div>
      
      <div class="filters-section">
        <div class="filter-header">
          <h5>Filter by Tags:</h5>
          <button id="clearFilters" class="btn btn-outline-secondary btn-sm">Clear All</button>
        </div>
        <div id="tagFilters" class="tag-filters">
          <!-- Tag filter buttons will be inserted here -->
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-dark">
            <tr>
              <th scope="col">Cust #</th>
              <th scope="col">Customer</th>
              <th scope="col">Loc #</th>
              <th scope="col">Location</th>
              <th scope="col">Tags</th>
            </tr>
          </thead>
          <tbody id="locationTableBody">
            <tr>
              <td colspan="5" class="text-center loading">Waiting for data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
   
    <script type="module">
      import "./src/index.js";
    </script>
  </body>
</html>
